<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8b5a2b">
<meta name="apple-mobile-web-app-title" content="Marcenaria">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Marcenaria — Orçamento & Corte V2.1</title>
<style>
:root{
  --primary:#8b5a2b; --primary-dark:#6b4423; --accent:#d97706;
  --bg:#f7f3ee; --card:#ffffff; --text:#2b2118; --muted:#7a6f63;
  --danger:#b91c1c; --danger-bg:#fef2f2; --ok:#166534; --border:#e2d8cb; --radius:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;}
body{padding-bottom:70px;}
h1,h2,h3{margin:0 0 8px 0;}
h2{font-size:17px;margin-top:18px;color:var(--primary-dark);}
h3{font-size:14px;}
p{margin:6px 0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:16px;}

#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;padding:12px 10px;padding-top:calc(12px + env(safe-area-inset-top));}
#topbar h1{flex:1;font-size:17px;text-align:center;}
.icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:8px 12px;font-size:15px;}
.icon-btn:active{background:rgba(255,255,255,.3);}

.view{padding:12px;max-width:640px;margin:0 auto;}
.card-list{display:flex;flex-direction:column;gap:10px;margin:10px 0;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.card-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
.card-main strong{font-size:15px;}
.card-main span{font-size:13px;color:var(--muted);}
.card-main .price{color:var(--primary-dark);font-weight:700;font-size:15px;}
.card-main .tag{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-size:11px;width:fit-content;}
.card-main .obs{font-style:italic;font-size:12px;}
.card-actions{display:flex;gap:6px;flex-shrink:0;}
.card-actions button{background:var(--bg);border:1px solid var(--border);border-radius:8px;width:38px;height:38px;font-size:16px;}
.empty{color:var(--muted);text-align:center;padding:20px 10px;font-size:14px;}

.btn{border:none;border-radius:var(--radius);padding:14px 16px;font-size:15px;font-weight:600;min-height:48px;}
.btn-block{width:100%;display:block;margin:8px 0;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-secondary{background:#fff;color:var(--primary-dark);border:1px solid var(--primary);}
.btn-secondary:active{background:var(--bg);}
.btn-danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}

.stats-row{display:flex;gap:8px;margin:12px 0;}
.stat-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center;}
.stat-card span{display:block;font-size:20px;font-weight:700;color:var(--primary-dark);}
.stat-card small{font-size:11px;color:var(--muted);}
.dashboard-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px;}

.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.form-card label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600;}
.form-card label input,.form-card label select,.form-card label textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-weight:400;}
.form-card label textarea{min-height:60px;resize:vertical;}
.row2{display:flex;gap:10px;}
.row2 label{flex:1;min-width:0;}
.field-check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--text);}
.field-check input{width:18px;height:18px;}
.switch-group{display:flex;gap:8px;margin-bottom:12px;}
.chip{flex:1;padding:10px;border-radius:8px;border:1px solid var(--primary);background:#fff;color:var(--primary-dark);font-weight:600;font-size:13px;}
.chip.active{background:var(--primary);color:#fff;}

.info-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin:10px 0;font-size:13px;}
.info-box.highlight{background:#fff7ed;border-color:var(--accent);font-size:15px;}
.alert{background:var(--danger-bg);color:var(--danger);border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0;}

.resumo-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.resumo-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;}
.resumo-line.total{font-weight:700;font-size:16px;}
.resumo-sub{font-size:12px;color:var(--muted);margin:-2px 0 8px 0;}
.preco-venda-box{background:var(--primary);color:#fff;border-radius:10px;padding:16px;margin:14px 0;display:flex;flex-direction:column;align-items:center;gap:4px;}
.preco-venda-box span{font-size:13px;letter-spacing:1px;}
.preco-venda-box strong{font-size:28px;}

.sheet-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin:14px 0;}
.sheet-block h3{color:var(--primary-dark);}
.sheet-block h3 small{color:var(--muted);font-weight:400;margin-left:6px;}
.sheet-visual{position:relative;width:100%;background:#faf7f2;border:2px solid #3a2f22;border-radius:4px;overflow:hidden;}
.sheet-margin-line{position:absolute;border:1px dashed #b5a998;pointer-events:none;}
.peca-box{position:absolute;border:1px solid #3a2f22;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:1px;font-size:10px;line-height:1.2;}
.peca-box .peca-nome{font-weight:700;}
.peca-box .peca-dim,.peca-box .peca-cod{font-size:9px;opacity:.8;}
.sobra-info{font-size:12px;color:var(--muted);margin-top:6px;}

#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);display:none;}
#bottomnav.flex-show{display:flex;}
.navbtn{flex:1;border:none;background:none;padding:8px 2px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;}
.navbtn span{font-size:19px;}
.navbtn.active{color:var(--primary);font-weight:700;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-box{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));}
.modal-form label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px;}
.modal-form input,.modal-form select,.modal-form textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--border);border-radius:8px;font-weight:400;color:var(--text);}
.modal-form textarea{min-height:60px;}
.modal-actions{display:flex;gap:10px;margin-top:10px;}
.modal-actions .btn{flex:1;margin:0;}
.export-textarea{width:100%;min-height:180px;font-family:monospace;font-size:12px;padding:8px;border:1px solid var(--border);border-radius:8px;}

#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);background:#2b2118;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:90%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.error{background:var(--danger);}

#print-area{display:none;}
.print-row{display:flex;justify-content:space-between;font-size:13px;margin:4px 0;}
.print-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;}
.print-table th,.print-table td{border:1px solid #999;padding:6px 8px;text-align:left;}
.print-total.destaque{background:#f2e9de;padding:8px;border-radius:6px;}

@media print{
  #topbar,#bottomnav,#view-dashboard,#view-project,#view-catalogo,#modal-root,#toast{display:none !important;}
  #print-area{display:block !important;padding:10px;color:#000;background:#fff;}
  body{padding-bottom:0;background:#fff;}
}
</style>
</head>
<body>

<header id="topbar">
  <button id="btnBack" class="icon-btn" data-action="voltar" style="display:none">←</button>
  <h1 id="topTitle">🪚 Marcenaria</h1>
  <button id="btnSave" class="icon-btn" data-action="salvar-projeto" style="display:none">💾</button>
</header>

<div id="install-info" class="info-box" style="margin:12px;display:none">
  <strong>🪚 Marcenaria V2.1 — modo offline</strong>
  <p>Para ter o melhor funcionamento no iPhone, abra este sistema pelo ícone instalado na Tela de Início.</p>
</div>

<main id="view-dashboard" class="view">
  <button class="btn btn-primary btn-block" data-action="novo-orcamento">+ NOVO ORÇAMENTO</button>
  <div class="stats-row">
    <div class="stat-card"><span id="statOrcamentos">0</span><small>Orçamentos</small></div>
    <div class="stat-card"><span id="statClientes">0</span><small>Clientes</small></div>
    <div class="stat-card"><span id="statUltimo">-</span><small>Último orçamento</small></div>
  </div>
  <h2>Projetos recentes</h2>
  <div id="listaProjetos" class="card-list"></div>
  <div class="dashboard-actions">
    <button class="btn btn-secondary" data-action="carregar-exemplo">📋 Carregar exemplo</button>
    <button class="btn btn-secondary" data-action="ir-catalogo">🗄️ Catálogo de materiais e preços</button>
  </div>
</main>

<main id="view-project" class="view" style="display:none">
  <section id="tab-orcamento" class="tab-content"></section>
  <section id="tab-materiais" class="tab-content" style="display:none"></section>
  <section id="tab-pecas" class="tab-content" style="display:none"></section>
  <section id="tab-corte" class="tab-content" style="display:none"></section>
  <section id="tab-resumo" class="tab-content" style="display:none"></section>
</main>

<main id="view-catalogo" class="view" style="display:none"></main>

<nav id="bottomnav">
  <button class="navbtn" data-action="switch-tab" data-tab="orcamento"><span>📝</span>Orçamento</button>
  <button class="navbtn" data-action="switch-tab" data-tab="materiais"><span>🪵</span>Materiais</button>
  <button class="navbtn" data-action="switch-tab" data-tab="pecas"><span>📐</span>Peças</button>
  <button class="navbtn" data-action="switch-tab" data-tab="corte"><span>✂️</span>Corte</button>
  <button class="navbtn" data-action="switch-tab" data-tab="resumo"><span>💰</span>Resumo</button>
</nav>

<div id="modal-root"></div>
<div id="toast"></div>
<div id="print-area"></div>

<script>
/* ===================== ESTADO GLOBAL ===================== */
let DB = { chapas:[], precos:[], projetos:[], config:{ valorHoraPadrao:25 } };
let currentView = 'dashboard';
let currentProjectId = null;
let currentTab = 'orcamento';
let catalogOrigemProjectId = null;
let storageAvailable = true;
let storageWarned = false;

/* ===================== ARMAZENAMENTO ===================== */
function loadDB(){
  try{
    const raw = localStorage.getItem('marcenariaDB_v21');
    if(raw){
      const parsed = JSON.parse(raw);
      DB = Object.assign({chapas:[],precos:[],projetos:[],config:{valorHoraPadrao:25}}, parsed);
    } else { seedDB(); }
  }catch(e){
    storageAvailable = false;
    seedDB();
    setTimeout(()=>{
      toast('Aviso: não foi possível usar o armazenamento local. O orçamento poderá não persistir neste ambiente.', 'error');
    }, 500);
  }
}
function saveDB(){
  try{ localStorage.setItem('marcenariaDB_v21', JSON.stringify(DB)); }
  catch(e){
    storageAvailable = false;
    if(!storageWarned){ storageWarned = true; toast('Não foi possível salvar neste ambiente. Verifique se o app foi instalado pela Tela de Início do iPhone.', 'error'); }
  }
}
function seedDB(){
  DB.chapas = [
    { id:uid(), nome:'MDF Branco 15mm', largura:1850, comprimento:2750, espessura:15, preco:185, kerf:3.2, margem:5, qtdDisponivel:'' },
    { id:uid(), nome:'MDF Branco 18mm', largura:1850, comprimento:2750, espessura:18, preco:215, kerf:3.2, margem:5, qtdDisponivel:'' }
  ];
  DB.precos = [
    { id:uid(), nome:'Fita de borda 22mm', preco:1.8, unidade:'m', tipo:'fita' },
    { id:uid(), nome:'Dobradiça', preco:7.5, unidade:'un', tipo:'ferragem' },
    { id:uid(), nome:'Parafuso', preco:0.35, unidade:'un', tipo:'ferragem' }
  ];
  DB.projetos = [];
  DB.config = { valorHoraPadrao:25 };
  saveDB();
}

/* ===================== UTILITÁRIOS ===================== */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(v){ return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso) return '-'; const p=iso.split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0] : iso; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function slug(s){ return String(s||'orcamento').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function setPath(obj, path, value){ const parts=path.split('.'); let o=obj; for(let i=0;i<parts.length-1;i++){ o=o[parts[i]]; } o[parts[parts.length-1]]=value; }
function toast(msg, type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(type==='error'?' error':''); clearTimeout(t._timer); t._timer=setTimeout(()=>{t.className='';}, 3500); }
function pieceColor(nome){
  const palette=['#fde68a','#bfdbfe','#bbf7d0','#fbcfe8','#fcd34d','#c7d2fe','#a7f3d0','#fecaca','#e9d5ff','#fed7aa'];
  let hash=0; for(const c of String(nome)) hash=(hash*31+c.charCodeAt(0))>>>0;
  return palette[hash%palette.length];
}

/* ===================== CONFIRMAÇÃO PRÓPRIA (substitui confirm()) ===================== */
function showConfirm(message, onYes, opts){
  opts = opts || {};
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" data-action="fechar-modal">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>${esc(opts.title||'Confirmar ação')}</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-action="fechar-modal">Cancelar</button>
        <button class="btn ${opts.danger===false?'btn-primary':'btn-danger'}" id="confirmYesBtn">${esc(opts.confirmLabel||'Confirmar')}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('confirmYesBtn').onclick = ()=>{ closeModal(); onYes(); };
}

/* ===================== PROJETOS ===================== */
function novoProjeto(){
  const p = {
    id:uid(), cliente:'', projetoNome:'Novo Orçamento', data:todayISO(), prazo:'', observacoes:'',
    chapaId: DB.chapas[0] ? DB.chapas[0].id : null,
    pecas:[], materiaisExtras:[],
    maoDeObra:{ modo:'fixo', valorFixo:0, valorHora:DB.config.valorHoraPadrao||0, horasProjeto:0, horasCorte:0, horasMontagem:0, horasInstalacao:0 },
    custosAdicionais:{ transporte:0, instalacao:0, outros:0 },
    perdaPercentual:5,
    precificacao:{ metodo:'margem', margem:30, multiplicador:1.5, arredondamento:'nao' },
    corteResultado:null,
    criadoEm:Date.now(), atualizadoEm:Date.now()
  };
  DB.projetos.push(p); saveDB(); return p;
}
function getProjeto(id){ return DB.projetos.find(p=>p.id===id); }
function salvarProjetoAtual(){
  const p=getProjeto(currentProjectId);
  if(!p){ toast('Nenhum orçamento aberto para salvar.', 'error'); return; }
  p.atualizadoEm=Date.now();
  saveDB();
  if(storageAvailable) toast('Orçamento salvo!'); else toast('Salvo apenas nesta sessão (armazenamento indisponível). Instale o app pela Tela de Início do iPhone.', 'error');
  renderTopbar();
}
function excluirProjeto(id){ DB.projetos = DB.projetos.filter(p=>p.id!==id); saveDB(); renderDashboard(); toast('Orçamento excluído.'); }
function duplicarProjeto(id){
  const orig=getProjeto(id); if(!orig) return;
  const copy=JSON.parse(JSON.stringify(orig));
  copy.id=uid(); copy.projetoNome=orig.projetoNome+' (cópia)'; copy.criadoEm=Date.now(); copy.atualizadoEm=Date.now();
  DB.projetos.push(copy); saveDB(); renderDashboard(); toast('Orçamento duplicado!');
}

/* ===================== CÁLCULO GERAL DO ORÇAMENTO ===================== */
function calcularOrcamento(p){
  const chapa = DB.chapas.find(c=>c.id===p.chapaId);
  let custoMDF=0, sheetsUsed=0, aproveitamento=0;
  if(chapa && p.corteResultado){
    sheetsUsed = p.corteResultado.sheets.length;
    custoMDF = sheetsUsed * (Number(chapa.preco)||0) * (1 + (Number(p.perdaPercentual)||0)/100);
    aproveitamento = p.corteResultado.aproveitamento;
  }
  const materiaisExtrasTotal = (p.materiaisExtras||[]).reduce((s,i)=> s + (Number(i.precoUnit)||0)*(Number(i.quantidade)||0), 0);
  const materiaisTotal = custoMDF + materiaisExtrasTotal;
  let maoObraTotal = 0;
  if(p.maoDeObra.modo==='fixo'){ maoObraTotal = Number(p.maoDeObra.valorFixo)||0; }
  else {
    const horas = (Number(p.maoDeObra.horasProjeto)||0) + (Number(p.maoDeObra.horasCorte)||0) + (Number(p.maoDeObra.horasMontagem)||0) + (Number(p.maoDeObra.horasInstalacao)||0);
    maoObraTotal = horas * (Number(p.maoDeObra.valorHora)||0);
  }
  const custosAdic = (Number(p.custosAdicionais.transporte)||0) + (Number(p.custosAdicionais.instalacao)||0) + (Number(p.custosAdicionais.outros)||0);
  const custoTotal = materiaisTotal + maoObraTotal + custosAdic;
  let precoVenda = 0;
  if(p.precificacao.metodo==='margem'){
    let m = Number(p.precificacao.margem)||0;
    if(m>=100) m=99; if(m<0) m=0;
    precoVenda = custoTotal/(1-(m/100));
  } else { precoVenda = custoTotal * (Number(p.precificacao.multiplicador)||1); }
  let precoFinal = precoVenda;
  if(p.precificacao.arredondamento==='cima') precoFinal = Math.ceil(precoVenda/50)*50;
  const lucro = precoFinal - custoTotal;
  return { chapa, sheetsUsed, custoMDF, materiaisExtrasTotal, materiaisTotal, maoObraTotal, custosAdic, custoTotal, precoVenda, precoFinal, lucro, aproveitamento };
}
function gerarAlertas(p, totals){
  const alertas = [];
  if(!totals.chapa) alertas.push('Nenhuma chapa de MDF foi selecionada para este orçamento.');
  if(!p.pecas.length) alertas.push('Nenhuma peça foi cadastrada.');
  if(p.pecas.length && !p.corteResultado) alertas.push('Calcule o plano de corte (aba Corte) para incluir o custo do MDF no orçamento.');
  p.pecas.forEach(pc=>{
    if(!pc.largura || !pc.comprimento || pc.largura<=0 || pc.comprimento<=0) alertas.push('A peça "'+pc.nome+'" está sem dimensão válida.');
    if(!pc.quantidade || pc.quantidade<=0) alertas.push('A peça "'+pc.nome+'" tem quantidade inválida.');
  });
  if(p.corteResultado && p.corteResultado.naoCabem && p.corteResultado.naoCabem.length){
    const nomes = [...new Set(p.corteResultado.naoCabem.map(i=>i.nome))].join(', ');
    alertas.push('As peças a seguir não cabem na chapa selecionada: '+nomes+'.');
  }
  if(totals.custoTotal>0 && totals.precoFinal < totals.custoTotal) alertas.push('O preço de venda está ABAIXO do custo total!');
  if(totals.precoFinal>0){
    const margemReal = (totals.lucro/totals.precoFinal)*100;
    if(margemReal>=0 && margemReal<10) alertas.push('A margem de lucro está muito baixa (menos de 10%).');
  }
  return alertas;
}

/* ===================== OTIMIZAÇÃO DE CORTE ===================== */
function buildItemsList(pecas){
  let items = [];
  pecas.forEach(pc=>{
    const qtd = Number(pc.quantidade)||0;
    for(let i=0;i<qtd;i++){ items.push({ pieceId:pc.id, codigo:pc.codigo, nome:pc.nome, w:Number(pc.largura), h:Number(pc.comprimento), podeGirar: !!pc.podeGirar }); }
  });
  return items;
}
function packItemsOnSheets(items, chapa){
  const kerf = Number(chapa.kerf)||0;
  const margem = Number(chapa.margem)||0;
  const usableW = chapa.largura - 2*margem;
  const usableH = chapa.comprimento - 2*margem;
  const naoCabem = [], validItems = [];
  items.forEach(it=>{
    const fitsNormal = it.w<=usableW && it.h<=usableH;
    const fitsRot = it.podeGirar && it.h<=usableW && it.w<=usableH;
    if(!fitsNormal && !fitsRot) naoCabem.push(it); else validItems.push(it);
  });
  const sheets = [];
  function place(shelf, sheet, item, w, h, rotated){
    const x = shelf.usedWidth + (shelf.usedWidth>0 ? kerf : 0);
    shelf.usedWidth = x + w;
    sheet.placements.push({ ...item, x, y:shelf.y, w, h, rotated });
  }
  function tryPlaceOnSheet(sheet, item){
    for(const shelf of sheet.shelves){
      const remW = usableW - shelf.usedWidth - (shelf.usedWidth>0 ? kerf : 0);
      if(item.w<=remW && item.h<=shelf.height){ place(shelf, sheet, item, item.w, item.h, false); return true; }
      if(item.podeGirar && item.h<=remW && item.w<=shelf.height){ place(shelf, sheet, item, item.h, item.w, true); return true; }
    }
    const last = sheet.shelves[sheet.shelves.length-1];
    const newY = last ? (last.y+last.height+kerf) : 0;
    if(item.h <= usableH-newY && item.w<=usableW){
      const shelf={y:newY,height:item.h,usedWidth:0}; sheet.shelves.push(shelf);
      place(shelf, sheet, item, item.w, item.h, false); return true;
    }
    if(item.podeGirar && item.w<=usableH-newY && item.h<=usableW){
      const shelf={y:newY,height:item.w,usedWidth:0}; sheet.shelves.push(shelf);
      place(shelf, sheet, item, item.h, item.w, true); return true;
    }
    return false;
  }
  validItems.forEach(item=>{
    let placed=false;
    for(const sheet of sheets){ if(tryPlaceOnSheet(sheet,item)){ placed=true; break; } }
    if(!placed){ const novaSheet={shelves:[], placements:[]}; sheets.push(novaSheet); tryPlaceOnSheet(novaSheet, item); }
  });
  let areaTotal=0;
  sheets.forEach(s=> s.placements.forEach(pl=> areaTotal += pl.w*pl.h));
  const areaChapas = sheets.length * chapa.largura * chapa.comprimento;
  const aproveitamento = areaChapas>0 ? (areaTotal/areaChapas*100) : 0;
  return { sheets, naoCabem, aproveitamento, usableW, usableH };
}
function packPieces(pecas, chapa){
  const baseItems = buildItemsList(pecas);
  const orders = [
    (a,b)=> (Math.max(b.w,b.h)-Math.max(a.w,a.h)) || (b.w*b.h-a.w*a.h),
    (a,b)=> (b.h-a.h) || (b.w-a.w),
    (a,b)=> (b.w-a.w) || (b.h-a.h),
    (a,b)=> (b.w*b.h - a.w*a.h)
  ];
  let best = null;
  orders.forEach(cmp=>{
    const items = baseItems.slice().sort(cmp);
    const result = packItemsOnSheets(items, chapa);
    if(!best || result.sheets.length < best.sheets.length || (result.sheets.length===best.sheets.length && result.aproveitamento>best.aproveitamento)){ best = result; }
  });
  return best || { sheets:[], naoCabem:[], aproveitamento:0 };
}
function calcSobra(sheet, chapa){
  const margem = Number(chapa.margem)||0;
  const usableW = chapa.largura-2*margem;
  const usableH = chapa.comprimento-2*margem;
  const lastShelf = sheet.shelves[sheet.shelves.length-1];
  const bottomY = lastShelf ? (lastShelf.y+lastShelf.height) : 0;
  let candidates = [ {w:usableW, h:usableH-bottomY} ];
  sheet.shelves.forEach(sh=> candidates.push({ w: usableW-sh.usedWidth, h: sh.height }) );
  let best = candidates[0];
  candidates.forEach(c=>{ if(c.w*c.h > best.w*best.h) best=c; });
  const aproveitavel = (best.w>150 && best.h>150) && (best.w*best.h > 0.03*usableW*usableH);
  return { w:Math.max(best.w,0), h:Math.max(best.h,0), aproveitavel };
}
function calcularECorte(){
  const p = getProjeto(currentProjectId);
  const chapa = DB.chapas.find(c=>c.id===p.chapaId);
  if(!chapa){ toast('Selecione uma chapa de MDF na aba Materiais.', 'error'); return; }
  if(!p.pecas.length){ toast('Cadastre ao menos uma peça antes de calcular.', 'error'); return; }
  for(const pc of p.pecas){
    if(!pc.largura || !pc.comprimento || pc.largura<=0 || pc.comprimento<=0){ toast('A peça "'+pc.nome+'" tem dimensão inválida.', 'error'); return; }
    if(!pc.quantidade || pc.quantidade<=0){ toast('A peça "'+pc.nome+'" tem quantidade inválida.', 'error'); return; }
  }
  p.corteResultado = packPieces(p.pecas, chapa);
  p.atualizadoEm = Date.now();
  saveDB();
  renderTab('corte');
  toast('Plano de corte calculado!');
}

/* ===================== NAVEGAÇÃO ===================== */
function showView(view){
  currentView = view;
  document.getElementById('view-dashboard').style.display = view==='dashboard' ? 'block':'none';
  document.getElementById('view-project').style.display = view==='project' ? 'block':'none';
  document.getElementById('view-catalogo').style.display = view==='catalogo' ? 'block':'none';
  document.getElementById('bottomnav').classList.toggle('flex-show', view==='project');
  if(view==='dashboard') renderDashboard();
  if(view==='catalogo') renderCatalogo();
  renderTopbar();
}
function renderTopbar(){
  const back=document.getElementById('btnBack'), save=document.getElementById('btnSave'), title=document.getElementById('topTitle');
  if(currentView==='dashboard'){ back.style.display='none'; save.style.display='none'; title.textContent='🪚 Marcenaria'; }
  else if(currentView==='catalogo'){ back.style.display='inline-block'; save.style.display='none'; title.textContent='Catálogo de materiais'; }
  else if(currentView==='project'){
    back.style.display='inline-block'; save.style.display='inline-block';
    const p=getProjeto(currentProjectId); title.textContent = p ? p.projetoNome : 'Orçamento';
  }
}
function goBack(){
  if(currentView==='catalogo' && catalogOrigemProjectId){ const id=catalogOrigemProjectId; catalogOrigemProjectId=null; openProject(id); }
  else { showView('dashboard'); }
}
function openProject(id){ currentProjectId=id; currentTab='orcamento'; showView('project'); switchTab('orcamento'); }
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-content').forEach(el=> el.style.display='none');
  document.getElementById('tab-'+tab).style.display='block';
  renderTab(tab);
  document.querySelectorAll('#bottomnav .navbtn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
}
function renderTab(tab){
  if(tab==='orcamento') renderTabOrcamento();
  else if(tab==='materiais') renderTabMateriais();
  else if(tab==='pecas') renderTabPecas();
  else if(tab==='corte') renderTabCorte();
  else if(tab==='resumo') renderTabResumo();
}

  }
  document.getElementById('tab-corte').innerHTML = html;
}
function renderSheetVisual(sheet, chapa, numero){
  const margem = Number(chapa.margem)||0;
  const usableW = chapa.largura - 2*margem;
  const usableH = chapa.comprimento - 2*margem;
  const marginLeft = (margem/chapa.largura*100).toFixed(3);
  const marginTop = (margem/chapa.comprimento*100).toFixed(3);
  const marginW = (usableW/chapa.largura*100).toFixed(3);
  const marginH = (usableH/chapa.comprimento*100).toFixed(3);
  const piecesHTML = sheet.placements.map(pl=>{
    const left = ((margem+pl.x)/chapa.largura*100).toFixed(3);
    const top = ((margem+pl.y)/chapa.comprimento*100).toFixed(3);
    const w = (pl.w/chapa.largura*100).toFixed(3);
    const h = (pl.h/chapa.comprimento*100).toFixed(3);
    return `<div class="peca-box" style="left:${left}%;top:${top}%;width:${w}%;height:${h}%;background:${pieceColor(pl.nome)};">
      <span class="peca-nome">${esc(pl.nome)}${pl.rotated?' ↻':''}</span>
      <span class="peca-dim">${pl.w}×${pl.h}</span>
      ${pl.codigo? `<span class="peca-cod">${esc(pl.codigo)}</span>` : ''}
    </div>`;
  }).join('');
  const sobra = calcSobra(sheet, chapa);
  return `<div class="sheet-block">
    <h3>CHAPA ${numero} <small>${chapa.largura} × ${chapa.comprimento} mm</small></h3>
    <div class="sheet-visual" style="aspect-ratio:${chapa.largura}/${chapa.comprimento}">
      <div class="sheet-margin-line" style="left:${marginLeft}%;top:${marginTop}%;width:${marginW}%;height:${marginH}%;"></div>
      ${piecesHTML}
    </div>
    <div class="sobra-info">Sobra aproximada: ${Math.round(sobra.w)} × ${Math.round(sobra.h)} mm — Aproveitável: <strong>${sobra.aproveitavel?'SIM':'NÃO'}</strong></div>
  </div>`;
}

/* ===================== MODAL GENÉRICO (formulários) ===================== */
function showModal(opts){
  const root = document.getElementById('modal-root');
  const fieldsHTML = opts.fields.map(f=>{
    if(f.type==='checkbox'){ return `<label class="field-check"><input type="checkbox" id="mf_${f.name}" ${f.value?'checked':''}> ${f.label}</label>`; }
    else if(f.type==='select'){
      const optsHTML = f.options.map(o=>`<option value="${o.value}" ${String(o.value)===String(f.value)?'selected':''}>${esc(o.label)}</option>`).join('');
      return `<label>${f.label}<select id="mf_${f.name}">${optsHTML}</select></label>`;
    } else if(f.type==='textarea'){ return `<label>${f.label}<textarea id="mf_${f.name}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea></label>`; }
    else { return `<label>${f.label}<input type="${f.type||'text'}" id="mf_${f.name}" value="${f.value??''}" ${f.step?`step="${f.step}"`:''} ${f.type==='number'?'inputmode="decimal"':''} placeholder="${esc(f.placeholder||'')}"></label>`; }
  }).join('');
  root.innerHTML = `<div class="modal-overlay" data-action="fechar-modal">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>${esc(opts.title)}</h3>
      <div class="modal-form">${fieldsHTML}</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-action="fechar-modal">Cancelar</button>
        <button class="btn btn-primary" id="modalSaveBtn">Salvar</button>
      </div>
    </div>
  </div>`;
  if(typeof opts.afterRender === 'function') opts.afterRender(root);
  document.getElementById('modalSaveBtn').onclick = ()=>{
    const values = {};
    opts.fields.forEach(f=>{
      const el = document.getElementById('mf_'+f.name);
      if(f.type==='checkbox') values[f.name] = el.checked;
      else if(f.type==='number') values[f.name] = el.value===''? 0 : parseFloat(String(el.value).replace(',','.'));
      else values[f.name] = el.value;
    });
    const err = opts.validate ? opts.validate(values) : null;
    if(err){ toast(err,'error'); return; }
    closeModal();
    opts.onSave(values);
  };
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function showTextExportModal(title, content, suggestedFilename){
  const root = document.getElementById('modal-root');

        <button class="btn btn-primary" id="copyExportBtn">Copiar tudo</button>

    </div>
  </div>`;
  const ta = document.getElementById('exportTextArea');

  if(!el.closest('#view-project')) return;
  const p = getProjeto(currentProjectId); if(!p) return;
  let value = el.value;

  saveDB();

}

function registerOfflineApp(){
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}
function initInstallInfo(){
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const box=document.getElementById('install-info');
  if(box && !standalone){ box.style.display='block'; }
}
function init(){ loadDB(); registerOfflineApp(); showView('dashboard'); initInstallInfo(); }
init();
</script>
